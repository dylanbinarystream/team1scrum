<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>BinaryStream Daily Scrum Spinner</title>

    <!-- Google Fonts: Manrope -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap core CSS -->
    <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="css/simple-sidebar.css" rel="stylesheet">
    
    <!-- Main CSS -->
    <link href="css/style.css" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/images/favicon/crypto.ico">
</head>

<body>
    <div id="wrapper">

        <!-- Sidebar -->
        <div id="sidebar-wrapper">
            <ul class="sidebar-nav">
                <li class="sidebar-brand">
                    <a href="#">
                        Menu 
                    </a>
                </li>
                <li>
                    <a href="#">Dashboard</a>
                </li>
                <li>
                    <a href="#">Credits</a>
                </li>
            </ul>
        </div>
        <!-- /#sidebar-wrapper -->

        <!-- Page Content -->
        <div id="page-content-wrapper">

            <!-- BinaryStream Header -->
            <div id="site-header">
                <h1 id="site-logo"><span class="logo-binary">Binary</span><span class="logo-stream">Stream</span></h1>
                <p id="site-subtitle">Daily Scrum Spinner</p>
            </div>

            <h1 id="result"><br> </h1>

            <!-- Button for expanding and collapsing the editable tables of active team members. -->
            <button id="members-editor-toggle-button" class="float-right" type="button" data-toggle="collapse" data-target="#members-editor-panel" aria-expanded="false" aria-controls="members-editor-panel">
                +
            </button>

            <!-- Dynamically updated table for permanent team members, and table for temporary team members. -->
            <div id="members-editor-panel" class="float-right collapse">
                <div id="members-panel-card">
                    <table id='permanent-members-table'>
                        <tbody>
                            <tr>
                                <th>Name</th><th>Available</th>
                            </tr>
                        </tbody>
                    </table>
                    
                    <br>
                    <div>
                        <input id="new_temp_text" type="text" minlength="1" size="5">
                        <button id="new_temp_btn" class="btn-secondary-bs" type="button">Add Temp</button>
                    </div>
                    <table id='temp-members-table'>
                        <tbody>
                            <tr>
                                <th>Name</th><th><button id="remove_all_temp_btn" class="btn-secondary-bs" type="button">Clear</button></th>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <button id="spin" type="button">Click to Spin!</button>
            <div style="position: relative; display: inline-block;">
                <canvas id="canvas" width="750" height="750"></canvas>
                <button id="spin2" type="button">Click to Spin!</button>
            </div>

            <div id="description" class="container-fluid">
                <br>
                <a href="#menu-toggle" class="btn-secondary-bs" id="menu-toggle">Toggle Menu</a>
            </div>

        </div>
        <!-- /#page-content-wrapper -->
        
    </div>
    <!-- /#wrapper -->

    <!-- Bootstrap core JavaScript -->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- https://github.com/js-cookie/js-cookie Klaus Hartl, Fagner Brack, Awesome Contributors; Pre-release v3.0.0-rc.1 Sep 8 2020 -->
    <script src="vendor/js-cookie/js.cookie.min.js"></script>

    <!-- My files -->
    <script src="js/scripts.js"></script>
    <script src="css/style.css"></script>


    <!-- Menu Toggle Script -->
    <script>
    $("#menu-toggle").click(function(e) {
        e.preventDefault();
        $("#wrapper").toggleClass("toggled");
    });
    </script>
    
    <!-- Members Editor Panel Toggle Button Script -->
    <script>
    $('#members-editor-panel').on('show.bs.collapse', function () {
        document.getElementById('members-editor-toggle-button').innerText = '-';
    })
    $('#members-editor-panel').on('hide.bs.collapse', function () {
        document.getElementById('members-editor-toggle-button').innerText = '+';
    })
    </script>

</body>

</html>
